<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gradCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B6046" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0E3828" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061F16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="wallLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A5D" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#144633" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A2A1E" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glassDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2F6EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2B8A66" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Wall / Room Background -->
  <rect width="1920" height="1080" fill="url(#gradCenter)"/>

  <!-- Architectural Windows & Clinic Interior Grid -->
  <rect x="900" y="80" width="940" height="680" rx="16" fill="url(#wallLight)" stroke="#3DA37D" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="900" y1="300" x2="1840" y2="300" stroke="#3DA37D" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="900" y1="520" x2="1840" y2="520" stroke="#3DA37D" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="1370" y1="80" x2="1370" y2="760" stroke="#3DA37D" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Soft Ambient Glows -->
  <circle cx="1500" cy="350" r="300" fill="#46B890" opacity="0.12"/>
  <circle cx="350" cy="250" r="400" fill="#1F8261" opacity="0.15"/>

  <!-- Doctor Workspace / Consultation Desk Contour -->
  <path d="M720 740L1920 720V1080H540L720 740Z" fill="url(#glassDesk)" stroke="#3DA37D" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M0 860L750 830L780 1080H0V860Z" fill="#0A2A1E" opacity="0.6"/>

  <!-- Medical Stethoscope & Charts Silhouette Artwork -->
  <g opacity="0.35" transform="translate(1380, 480)">
    <circle cx="160" cy="180" r="28" stroke="#82CAA9" stroke-width="4" fill="none"/>
    <path d="M160 208C160 260 220 300 280 300C340 300 400 260 400 208V110" stroke="#82CAA9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M370 110H430" stroke="#82CAA9" stroke-width="4" stroke-linecap="round"/>
    <path d="M260 300V360" stroke="#82CAA9" stroke-width="4"/>
    <circle cx="260" cy="380" r="20" stroke="#82CAA9" stroke-width="4" fill="#0D3829"/>
  </g>

  <!-- Medical Cross Subtle Crest -->
  <g opacity="0.15" transform="translate(150, 120)">
    <rect x="50" y="0" width="30" height="130" rx="6" fill="#82CAA9"/>
    <rect x="0" y="50" width="130" height="30" rx="6" fill="#82CAA9"/>
  </g>

  <!-- Clean Floor Horizon -->
  <line x1="0" y1="840" x2="1920" y2="840" stroke="#3DA37D" stroke-width="1" stroke-opacity="0.2"/>
</svg>
